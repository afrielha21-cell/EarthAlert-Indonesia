name: Sinkronisasi Gempa Terkini BMKG
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Ambil JSON resmi BMKG
        run: python3 scripts/sync_bmkg.py
      - name: Pastikan snapshot berisi data sebelum commit
        run: |
          python3 - <<'PY2'
          import json
          from pathlib import Path
          snap=json.loads(Path('data/bmkg_snapshot.json').read_text('utf-8'))
          feeds=snap.get('feeds',{})
          if not feeds:
              raise SystemExit('BMKG belum dapat diakses; snapshot kosong tidak akan dipublikasikan.')
          print('Feeds tersedia:',sorted(feeds))
          PY2
      - name: Kirim snapshot untuk GitHub Pages branch main
        run: |
          git config user.name 'EarthAlert BMKG Sync'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/bmkg_snapshot.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh official BMKG earthquake snapshot'
            git push origin HEAD:main
          else
            echo 'Snapshot unchanged'
          fi
